name: Deploy

on:
    push:
        branches: [production]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Test
              run: go test ./... -v

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: docker build -t skarmdump-backend:latest .

            - name: Save image to archive
              run: docker save skarmdump-backend:latest | gzip > skarmdump-backend.tar.gz

            - name: Copy archive to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "skarmdump-backend.tar.gz"
                  target: "~/skarmdump-backend"

            - name: Load image and start container
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      set -e
                      cd ~/skarmdump-backend

                      echo "--- Загрузка образа ---"
                      gunzip -c skarmdump-backend.tar.gz | docker load
                      rm -f skarmdump-backend.tar.gz

                      echo "--- Container launch ---"
                      docker stop skarmdump-backend 2>/dev/null || true
                      docker rm skarmdump-backend 2>/dev/null || true

                      docker run -d --restart unless-stopped \
                          --name skarmdump-backend \
                          -p 127.0.0.1:8081:8080 \
                          --env-file ~/skarmdump-backend/.env \
                          -v ~/skarmdump-backend/img:/app/img \
                          skarmdump-backend:latest

                      echo "--- Check ---"
                      sleep 2
                      if docker ps --filter name=skarmdump-backend --format "{{.Status}}" | grep -q Up; then
                          echo "Success"
                          docker ps --filter name=skarmdump-backend --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                      else
                          echo "Error"
                          docker logs skarmdump-backend 2>&1 || true
                          exit 1
                      fi

                      docker image prune -f
